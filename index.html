<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Nulis Jawa</title>
    
    <!-- Mencegah Error 404 Favicon -->
    <link rel="icon" href="data:,">

    <style>
        /* === DEKLARASI FONT NYK NGAYOGYAN JEJEG === */
        @font-face {
            font-family: 'Nyk Ngayogyan Jejeg';
            src: url('NykNgayogyanJejeg.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            touch-action: manipulation;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            overflow-y: auto;
            padding: 10px 5px;
        }

        /* Form Identitas Siswa */
        .start-screen {
            width: 90%;
            max-width: 350px;
            padding: 15px 20px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border: 2px solid #333;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        .start-screen h1 {
            font-size: 29px; /* <------ JUDUL UTAMA */
            margin-bottom: 3px;
            color: #333;
            cursor: pointer;
            user-select: none;
        }

        .start-screen h2 {
            font-size: 19px; /* <------- Sub Judul */
            margin-bottom: 12px;
            color: #666;
        }

        .form-group {
            margin-bottom: 10px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 3px;
            font-weight: bold;
            font-size: 18px; /* <-------- Teks petunjuk input */
            color: #333;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 8px 10px;
            font-size: 18px; /* <-------- Teks di dalam kotak isian & dropdown */
            border: 2px solid #ccc;
            border-radius: 6px;
            background-color: #fff;
        }

        .form-group select {
            padding: 6px 8px;
            font-size: 18px;  /* <--- Teks khusus pilihan dropdown */
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-start {
            width: 100%;
            padding: 10px;
            background-color: #055205;
            color: white;
            font-size: 16px; /* Teks Tombol "Mulai Main" */
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            margin-top: 5px;
        }

        /* Container Game */
        .game-container {
            display: none;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }

        /* Info Game Header */
        .info {
            font-size: 15px;
            font-weight: bold;
            background-color: #333;
            padding: 6px 10px;
            color: white;
            border-radius: 6px;
            margin-bottom: 6px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .heart-icon {
            color: #ff4d4d;
            font-size: 15px;
            letter-spacing: 1px;
        }

        /* Soal Latin */
        .output1 {
            font-size: 20px;
            color: #0000ff;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        /* Area Jawaban Aksara Jawa */
        .output2 {            
            font-size: 32px;
            color: #0000ff;
            font-weight: bold;
            min-height: 65px;
            max-height: 90px;
            line-height: 1.3;
            font-family: 'Nyk Ngayogyan Jejeg', sans-serif !important;
            background-color: #fff;
            border: 2px solid #333;
            border-radius: 6px;
            margin-bottom: 8px;
            padding: 4px;
            overflow-y: auto;
            word-wrap: break-word;
            text-align: center;
        }

        /* Grid Papan Ketik */
        .game-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            justify-content: center;
            margin-bottom: 10px;
        }

        /* Tombol Papan Ketik */
        .button {
            height: 58px;
            background-color: #FEFDBC;
            border: 1.5px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            font-family: 'Nyk Ngayogyan Jejeg', sans-serif !important;
            color: #111;
            cursor: pointer;
            border-radius: 6px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .button.pressed, .control-button.pressed, .btn-start.pressed, .button:active, .control-button:active {
            transform: translateY(2px);
            background-color: #e6e5a0;
        }

        /* Tombol Kontrol Bawah */
        .controls {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 2px;
        }

        .control-button {
            flex: 1;
            padding: 12px 0;
            background-color: #055205;
            border: 1.5px solid #333;
            color: white;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .control-button.shift {
            background-color: #0056b3;
        }

        .control-button.delete {
            background-color: #A00101;
        }

        .sending-status {
            font-size: 13px;
            color: #555;
            margin-top: 8px;
            font-style: italic;
        }

        /* Modal / Popup Ubah Password & Pengaturan Guru */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 340px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: left;
        }

        .modal-content h3 {
            margin-bottom: 12px;
            font-size: 16px;
            color: #333;
            text-align: center;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-modal {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-modal-save {
            background-color: #055205;
            color: white;
        }

        .btn-modal-cancel {
            background-color: #A00101;
            color: white;
        }
    </style>
</head>
<body>

    <!-- HALAMAN AWAL (FORM IDENTITAS) -->
    <div class="start-screen" id="startScreen">
        <!-- Judul diberi ID untuk deteksi 5 kali ketukan -->
        <h1 id="gameTitle">Game Nulis Jawa</h1>
        <h2>Isi Identitas & Pilih Level</h2>
        <form id="studentForm">
            <!-- 1. Nomor Absen Dropdown -->
            <div class="form-group">
                <label for="studentAbsen">1. Nomor Absen:</label>
                <select id="studentAbsen" required>
                    <option value="" disabled selected>-- Pilih Nomor Absen --</option>
                    <script>
                        for(let i = 1; i <= 40; i++) {
                            document.write(`<option value="${i}">${i}</option>`);
                        }
                    </script>
                </select>
            </div>

            <!-- 2. Nama Lengkap Input -->
            <div class="form-group">
                <label for="studentName">2. Nama Lengkap:</label>
                <input type="text" id="studentName" placeholder="Masukkan nama..." required>
            </div>

            <!-- 3. Kelas Dropdown -->
            <div class="form-group">
                <label for="studentKelas">3. Kelas:</label>
                <select id="studentKelas" required>
                    <option value="" disabled selected>-- Pilih Kelas --</option>
                    <script>
                        const tingkat = ['7', '8', '9'];
                        const abjad = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I'];
                        tingkat.forEach(t => {
                            abjad.forEach(a => {
                                document.write(`<option value="${t}${a}">${t}${a}</option>`);
                            });
                        });
                    </script>
                </select>
            </div>

            <!-- 4. Level Game Dropdown -->
            <div class="form-group">
                <label for="studentLevel">4. Level Game:</label>
                <select id="studentLevel" required>
                    <option value="" disabled selected>-- Pilih Level --</option>
                    <option value="Level 1">Level 1 (Aksara legena)</option>
                    <option value="Level 2">Level 2 (Sandhangan swara)</option>
                    <option value="Level 3">Level 3 (Sandhangan panyigeg wanda)</option>
                    <option value="Level 4">Level 4 (Pasangan)</option>
                    <option value="Level 5">Level 5 (Sandhangan wyanjana & panjingan)</option>
                    <option value="Level 6">Level 6 (Aksara murda & aksara swara)</option>
                    <option value="Level 7">Level 7 (Aksara rekan)</option>
                    <option value="Level 8">Level 8 (Angka & tandha wacan)</option>
                </select>
            </div>

            <!-- 5. Jenis Tes Dropdown -->
            <div class="form-group">
                <label for="studentMode">5. Jenis Tes:</label>
                <select id="studentMode" onchange="togglePasswordInput()" required>
                    <option value="Formatif" selected>Tes Formatif (Latihan)</option>
                    <option value="Sumatif">Tes Sumatif (Ujian)</option>
                </select>
            </div>
            
            <!-- 6. Token Ujian (Hidden by Default) -->
            <div class="form-group" id="passContainer" style="display: none;">
                <label for="teacherPass">6. Token Ujian (Dari Guru):</label>
                <input type="password" id="teacherPass" placeholder="Masukkan token">
            </div>
            
            <button type="button" class="btn-start" id="startBtn">MULAI MAIN</button>
        </form>
    </div>

    <!-- HALAMAN PERMAINAN -->
    <div class="game-container" id="gameContainer">
        <div class="info" id="gameInfo">
            <span id="time">Wektu: 60 s</span>
            <span>Nyawa: <span id="lives" class="heart-icon">❤️❤️❤️</span></span>
            <span id="score">Skor: 0</span>
        </div>

        <!-- Soal Latin -->
        <div class="output1" id="latinWord">-</div>
        
        <!-- Input Jawaban Jawa -->
        <div class="output2" id="jawaWord"></div>

        <!-- Papan Tombol Aksara -->
        <div class="game-board" id="jawaBoard"></div>

        <!-- Tombol Kontrol Bawah -->
        <div class="controls">
            <button class="control-button shift" id="shiftButton">SHIFT 2</button>
            <button class="control-button delete" id="deleteButton">GOSOK</button>
            <button class="control-button confirm" id="confirmButton">KIRIM</button>   
        </div>
    </div>

    <!-- POPUP / MODAL UBAH PENGATURAN GURU -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal-content">
            <h3>⚙️ Pengaturan Guru</h3>
            <div class="form-group">
                <label for="oldPassInput">Password Akses Guru:</label>
                <!-- Input dikosongkan agar guru mengetik manual JAWA2026 -->
                <input type="password" id="oldPassInput" placeholder="Masukkan password master...">
            </div>
            <div class="form-group">
                <label for="newPassInput">Password Sumatif Baru (Opsional):</label>
                <input type="password" id="newPassInput" placeholder="Biarkan kosong jika tidak diubah">
            </div>
            <div class="form-group">
                <label for="gameTimerInput">Batas Waktu Game (Detik):</label>
                <input type="number" id="gameTimerInput" placeholder="Contoh: 60">
            </div>
            <div class="form-group">
                <label for="totalQuestionsInput">Jumlah Soal Per Permainan:</label>
                <input type="number" id="totalQuestionsInput" placeholder="Contoh: 10">
            </div>
            <div class="modal-buttons">
                <button class="btn-modal btn-modal-cancel" id="cancelPassBtn">Batal</button>
                <button class="btn-modal btn-modal-save" id="savePassBtn">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        // === TEMPELKAN URL APPS SCRIPT ANDA DI SINI ===
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyRsCWBySha_esKugE48BZgFMdfmHExF03-8hrKuZUS-SC55Fen5TWEuOgRXJtYJxTJ/exec";
        
        let TOKEN_SUMATIF = "JAWA2026"; // Default sementara
        let activePassword = "JAWA2026"; 
        let GAME_TIMER = 60;          // Waktu default (detik)[cite: 3]
        let TOTAL_SOAL_GAME = 10;     // Max soal default per game[cite: 3]
        
        // Fungsi Sinkronisasi Pengaturan (Password, Waktu, Jumlah Soal) dari Cloud Google Sheet[cite: 3]
        function syncSettingsFromCloud() {
            fetch(GOOGLE_SCRIPT_URL)
                .then(response => response.json())
                .then(data => {
                    if (data) {
                        if (data.password) {
                            TOKEN_SUMATIF = String(data.password);
                            activePassword = String(data.password);
                        }
                        if (data.waktu && !isNaN(data.waktu)) {
                            GAME_TIMER = Number(data.waktu);
                        }
                        if (data.jumlahSoal && !isNaN(data.jumlahSoal)) {
                            TOTAL_SOAL_GAME = Number(data.jumlahSoal);
                        }
                        console.log("Pengaturan Cloud berhasil dimuat:", { TOKEN_SUMATIF, GAME_TIMER, TOTAL_SOAL_GAME });
                    }
                })
                .catch(err => console.log("Gagal mengambil pengaturan dari cloud. Menggunakan setting default/cache."));
        }
        
        // Panggil fungsi sinkronisasi saat halaman pertama kali dibuka
        window.addEventListener("DOMContentLoaded", syncSettingsFromCloud);

        // --- FITUR KETUK JUDUL 5 KALI (SECRET ADMIN POPUP) ---
        let titleTapCount = 0;
        let tapTimer = null;
        const gameTitle = document.getElementById("gameTitle");
        const passwordModal = document.getElementById("passwordModal");
        
        // 1. Deteksi Ketuk 5x
        gameTitle.addEventListener("click", () => {
            titleTapCount++;
            clearTimeout(tapTimer);

            if (titleTapCount === 5) {
                titleTapCount = 0;
                // Buka popup & isi nilai awal pada form input modal[cite: 3]
                //Kosongkan input password master agar wajib diketik manual
                document.getElementById("oldPassInput").value = "";
                document.getElementById("newPassInput").value = "";
                document.getElementById("gameTimerInput").value = GAME_TIMER;
                document.getElementById("totalQuestionsInput").value = TOTAL_SOAL_GAME;
                passwordModal.style.display = "flex";
            } else {
                // Reset hitungan jika jeda mengetuk lebih dari 0.3 detik
                tapTimer = setTimeout(() => {
                    titleTapCount = 0;
                }, 300);
            }
        });

        // Tombol Simpan Pengaturan Baru (Password, Waktu, & Jumlah Soal ke Apps Script)[cite: 3]
        // Tombol Simpan Pengaturan Baru (Dioptimalkan agar Alert Langsung Muncul)
        // 2. Tombol Simpan Pengaturan Baru ##########
        // 2. Tombol Simpan Pengaturan Baru
                document.getElementById("savePassBtn").addEventListener("click", () => {
                    const masterPass = document.getElementById("oldPassInput").value.trim();
                    const newPass = document.getElementById("newPassInput").value.trim();
                    const newTime = document.getElementById("gameTimerInput").value.trim();
                    const newQuestions = document.getElementById("totalQuestionsInput").value.trim();
        
                    // Verifikasi Password Akses Guru secara MANUAL dengan "JAWA2026"
                    if (masterPass !== "JAWA2026") {
                        showAlert("❌ Password Akses Guru Salah!");
                        return;
                    }
        
                    if (!newTime || !newQuestions || Number(newTime) <= 0 || Number(newQuestions) <= 0) {
                        showAlert("⚠️ Batas waktu dan jumlah soal harus diisi angka positif!");
                        return;
                    }
        
                    // Perbarui data lokal secara instan
                    if (newPass !== "") {
                        TOKEN_SUMATIF = newPass;
                        activePassword = newPass;
                    }
                    GAME_TIMER = Number(newTime);
                    TOTAL_SOAL_GAME = Number(newQuestions);
        
                    // Kirim data ke Google Sheets menggunakan sendBeacon (Sangat Cepat & Tanpa Delay)
                    const formData = new URLSearchParams();
                    formData.append("action", "update_settings");
                    formData.append("new_password", newPass !== "" ? newPass : activePassword);
                    formData.append("new_waktu", newTime);
                    formData.append("new_jumlah_soal", newQuestions);
        
                    const blob = new Blob([formData.toString()], { type: 'application/x-www-form-urlencoded' });
                    
                    if (navigator.sendBeacon) {
                        navigator.sendBeacon(GOOGLE_SCRIPT_URL, blob);
                    } else {
                        fetch(GOOGLE_SCRIPT_URL, {
                            method: "POST",
                            mode: "no-cors",
                            headers: { "Content-Type": "application/x-www-form-urlencoded" },
                            body: formData.toString()
                        });
                    }
        
                    // Tampilkan Alert & Tutup Modal Seketika
                    showAlert("✅ Pengaturan berhasil diperbarui secara ONLINE!");
                    document.getElementById("oldPassInput").value = "";
                    document.getElementById("newPassInput").value = "";
                    passwordModal.style.display = "none";
                });

        // Tombol Batal Modal
        document.getElementById("cancelPassBtn").addEventListener("click", () => {
            passwordModal.style.display = "none";
        });

        // Tampilkan/Sembunyikan Input Token Sumatif
        function togglePasswordInput() {
            const mode = document.getElementById("studentMode").value;
            const passContainer = document.getElementById("passContainer");
            if (mode === "Sumatif") {
                passContainer.style.display = "block";
            } else {
                passContainer.style.display = "none";
            }
        }
        
        // --- WEB AUDIO API ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSoundTombol() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playSoundHapus() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playSoundBenar() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
            gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playSoundSalah() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        function playSoundGameOver() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.6);
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
        }

        function playSoundFinish() {
            initAudio();
            if (!audioCtx) return;
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (index * 0.1));
                gain.gain.setValueAtTime(0.7, audioCtx.currentTime + (index * 0.1));
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (index * 0.1) + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + (index * 0.1));
                osc.stop(audioCtx.currentTime + (index * 0.1) + 0.2);
            });
        }

        function triggerPressAnimation(element) {
            element.classList.add("pressed");
            setTimeout(() => {
                element.classList.remove("pressed");
            }, 100);
        }

        // --- DATABASE SOAL 8 LEVEL ---
        const levelData = {

            const inputName = document.getElementById("studentName").value.trim();
            const inputKelas = document.getElementById("studentKelas").value;
            const inputLevel = document.getElementById("studentLevel").value;
            const inputMode = document.getElementById("studentMode").value;
            const inputPass = document.getElementById("teacherPass").value.trim();

            if (!inputAbsen || inputName === "" || !inputKelas || !inputLevel) {
                showAlert("Nuwun sewu, isi No Absen, Nama, Kelas, lan Pilih Level rumiyin!");
                return;
            }

            // Validasi khusus mode Sumatif
            if (inputMode === "Sumatif" && (inputPass !== TOKEN_SUMATIF && inputPass !== activePassword)) {
                showAlert("❌ Token Ujian Sumatif Salah! Hubungi guru Anda.");
                return;
            }

            absenSiswa = inputAbsen;

            if (!levelData[levelSiswa]) {
                showAlert("Level belum tersedia!");
                return;
            }

            // ACAK SOAL (DISESUAIKAN DENGAN TOTAL_SOAL_GAME DARI SETTING)[cite: 3]
            let poolLatin = [...levelData[levelSiswa].latin];
            let poolJawa = [...levelData[levelSiswa].jawa];

            activeLatinWords = [];
            activeJawaWords = [];

            const jumlahSoal = Math.min(TOTAL_SOAL_GAME, poolLatin.length);

            for (let i = 0; i < jumlahSoal; i++) {
                const randomIndex = Math.floor(Math.random() * poolLatin.length);
                activeLatinWords.push(poolLatin.splice(randomIndex, 1)[0]);
                activeJawaWords.push(poolJawa.splice(randomIndex, 1)[0]);
            }

            totalQuestions = activeLatinWords.length;

            startScreen.style.display = "none";
            gameContainer.style.display = "block";
            
            startGame();
        });

        function chooseNewWord() {
            if (activeLatinWords.length === 0) {
                gameFinish();
                return;
            }
            const index = Math.floor(Math.random() * activeLatinWords.length);
            currentLatin = activeLatinWords.splice(index, 1)[0];
            currentJawa = activeJawaWords.splice(index, 1)[0];            
            latinWordEl.textContent = currentLatin;
            jawaWordEl.textContent = "";
        }

        function renderBoard() {
            jawaBoard.innerHTML = "";
            const activeLetters = (currentBoardMode === 1) ? jawaLettersPrimary : jawaLettersSecondary;
            
            activeLetters.forEach(letter => {
                const button = document.createElement("div");
                button.className = "button";
                button.textContent = letter;
                
                button.addEventListener("pointerdown", () => {
                    triggerPressAnimation(button);
                    jawaWordEl.textContent += letter;
                    jawaWordEl.scrollTop = jawaWordEl.scrollHeight;
                    playSoundTombol();
                });
                
                jawaBoard.appendChild(button);
            });
        }

        function updateLivesDisplay() {
            let hearts = "";
            for (let i = 0; i < lives; i++) {
                hearts += "❤️";
            }
            livesEl.textContent = hearts || "-";
        }

        shiftButton.addEventListener("pointerdown", () => {
            triggerPressAnimation(shiftButton);
            playSoundTombol();
            if (currentBoardMode === 1) {
                currentBoardMode = 2;
                shiftButton.textContent = "SHIFT 1";
            } else {
                currentBoardMode = 1;
                shiftButton.textContent = "SHIFT 2";
            }
            renderBoard();
        });

            const kunciJawaban = currentJawa.trim();

            if (inputUser === kunciJawaban) {
                score++;
                playSoundBenar();
                scoreEl.textContent = `Skor: ${((score / totalQuestions) * 100).toFixed(1)}`;
                chooseNewWord();
            } else {
                lives--;
                playSoundSalah();
                updateLivesDisplay();
                if (lives <= 0) {
                    gameOver();
                }
            }
        });

            if (text.length > 0) {
                jawaWordEl.textContent = Array.from(text).slice(0, -1).join('');

            playSoundHapus();
        });

        function startGame() {

            timeEl.textContent = `Wektu: ${timeLeft} s`;

            chooseNewWord();
            renderBoard();
            updateLivesDisplay();

            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                timeEl.textContent = `Wektu: ${timeLeft} s`;
                if (timeLeft <= 0 || lives <= 0) {
                    gameOver();
                }
            }, 1000);
        }
        
        // PENGIRIMAN DATA KE GOOGLE SHEET
        function sendDataToGoogleSheet(finalScore, gameStatus, statusElementId) {
            const statusEl = document.getElementById(statusElementId);
            const selectedMode = document.getElementById("studentMode").value;
        
            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("https://script.google.com/macros/s/AKfycbz5lH1HdRwu2eXL2HQsBUD7lPTfUdbfmzGuEAX_Q5xw0Vc02fvOmBibIzgSzmAprA1Y/exec")) {
                if (statusEl) statusEl.textContent = "(Data belum terhubung ke Google Sheet)";
                return;
            }
        
            const formData = new URLSearchParams();
            formData.append("action", "submit_score");
            formData.append("absen", absenSiswa);
            formData.append("nama", namaSiswa);
            formData.append("kelas", kelasSiswa);
            formData.append("level", levelSiswa);
            formData.append("skor", finalScore);
            formData.append("status", gameStatus);
            formData.append("mode", selectedMode); 
        
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: formData.toString()
            })
            .then(() => {
                if (statusEl) statusEl.textContent = `✓ Nilai ${selectedMode} Berhasil Disimpan!`;
            })
            .catch(error => {
                console.error("Error:", error);
                if (statusEl) statusEl.textContent = "❌ Gagal menyimpan data.";
            });
        }

                <p style="font-size: 14px; margin: 4px 0;"><strong>No. Absen:</strong> ${absenSiswa}</p>
                <p style="font-size: 14px; margin: 4px 0;"><strong>Nama:</strong> ${namaSiswa}</p>
                <p style="font-size: 14px; margin: 4px 0;"><strong>Kelas:</strong> ${kelasSiswa}</p>
                <p style="font-size: 14px; margin: 4px 0;"><strong>Level:</strong> ${levelSiswa}</p>
                <h2 style="font-size: 15px; margin-top: 8px;">Skor Anda:</h2>
                <h1 style="font-size: 38px; color: #055205; margin: 4px 0;">${finalScore}</h1>
                <div class="sending-status" id="sendStatus">Menyimpan nilai ke Google Sheet...</div>
                <h3 style="margin-top: 12px; font-size: 15px;">Refresh halaman untuk main maneh!</h3>
            `;
            playSoundFinish();
            document.body.appendChild(gameFinishMessage);

            sendDataToGoogleSheet(finalScore, "Finish", "sendStatus");
        }

        function showAlert(message) {
            const modal = document.getElementById("customAlertModal");
            const msgElem = document.getElementById("customAlertMessage");
            const btn = document.getElementById("customAlertBtn");
        
            msgElem.innerText = message;
            modal.style.display = "flex";
        
            btn.onclick = function() {
                modal.style.display = "none";
            };
        }
    </script>

    <!-- Modal Peringatan Kustom -->
    <div id="customAlertModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center;">
        <div style="background: #fff; padding: 20px; border-radius: 10px; max-width: 300px; width: 80%; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
            <p id="customAlertMessage" style="font-size: 16px; font-weight: bold; margin-bottom: 20px; color: #333;"></p>
            <button id="customAlertBtn" style="padding: 8px 20px; background-color: #055205; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">OK</button>
        </div>
    </div>
</body>
</html>
